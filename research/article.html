<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Central Asia Trade Research</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .article-meta-bar{
    position:relative; z-index:1;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  .back-link{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing:0.04em;
    color: var(--ink-dim); text-decoration:none;
  }
  .back-link:hover{ color: var(--gold-bright); }
  .byline{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-dim); }
  .cover-img{ width:100%; max-height: 420px; object-fit: cover; border: 1px solid var(--line); margin-bottom: 40px; }
  .prose h2{ font-family:'Fraunces', serif; font-weight:600; font-size: 26px; margin: 34px 0 14px; color: var(--ink); }
  .prose h3{ font-family:'Fraunces', serif; font-weight:600; font-size: 21px; margin: 28px 0 12px; color: var(--ink); }
  .prose ul, .prose ol{ color: var(--ink-dim); font-size: 17px; margin: 0 0 18px 22px; }
  .prose li{ margin-bottom: 6px; }
  .prose img{ max-width:100%; border: 1px solid var(--line); margin: 20px 0; }
  .prose blockquote{
    border-left: 2px solid var(--wine); padding-left: 20px; margin: 24px 0;
    font-style: italic; color: var(--ink);
  }
  .prose a{ color: var(--teal-bright); text-decoration:none; border-bottom: 1px dotted var(--teal-bright); }
  .prose code{ font-family:'IBM Plex Mono', monospace; font-size: 0.9em; background: var(--bg-raised); padding: 2px 5px; }
  #notFound{ display:none; padding: 60px 0; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/logo.png" alt="Central Asia Trade Research">Central Asia Trade Research</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/research/" class="active">Research</a></li>
      <li><a href="/data/">Data</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </div>
</nav>

<div class="wrap article-meta-bar">
  <a class="back-link" href="/research/">← Back to Research</a>
  <span class="byline" id="byline"></span>
</div>

<div id="articleRoot" class="wrap" style="display:none;">
  <article>
    <header class="hero">
      <div class="eyebrow"><span class="dot"></span><span id="eyebrowText">RESEARCH DOSSIER</span></div>
      <h1 id="articleTitle"></h1>
      <p class="dek" id="articleDek"></p>
    </header>
    <section style="border-bottom:none;">
      <img id="coverImg" class="cover-img" style="display:none;">
      <div class="prose" id="articleBody"></div>
    </section>
    <footer>
      <p><a href="/research/">← Back to all research</a></p>
    </footer>
  </article>
</div>

<div id="notFound" class="wrap">
  <header class="hero" style="border-bottom:none;">
    <div class="eyebrow"><span class="dot"></span>NOT FOUND</div>
    <h1>This dossier isn't available</h1>
    <p class="dek">It may still be a draft, or the link may be incorrect.</p>
    <a class="btn" href="/research/">← Back to Research</a>
  </header>
</div>

<script>
  const slug = new URLSearchParams(window.location.search).get('slug');

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    } catch { return iso; }
  }

  async function loadArticle() {
    if (!slug) {
      document.getElementById('notFound').style.display = 'block';
      return;
    }
    try {
      const res = await fetch(`/api/public/articles/${encodeURIComponent(slug)}`);
      if (!res.ok) {
        document.getElementById('notFound').style.display = 'block';
        return;
      }
      const data = await res.json();
      const a = data.article;

      document.title = `${a.title} — Central Asia Trade Research`;
      document.getElementById('articleTitle').textContent = a.title;
      document.getElementById('articleDek').textContent = a.dek || '';
      document.getElementById('byline').textContent = `Published ${fmtDate(a.date)} · Central Asia Trade Research`;
      document.getElementById('articleBody').innerHTML = marked.parse(a.body || '');

      if (a.coverImageUrl) {
        const img = document.getElementById('coverImg');
        img.src = a.coverImageUrl;
        img.alt = a.title;
        img.style.display = 'block';
      }

      document.getElementById('articleRoot').style.display = 'block';
    } catch (err) {
      document.getElementById('notFound').style.display = 'block';
    }
  }

  loadArticle();
</script>

</body>
</html>
