<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Product Editor — Central Asia Trade Research</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .admin-nav .wrap{ padding:18px 28px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:8px; }
  .field input,.field textarea{ width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--ink); font:15px 'Source Serif 4',serif; padding:11px 12px; }
  .field textarea{ resize:vertical; }
  .field input:focus,.field textarea:focus{ outline:none; border-color:var(--gold); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .actions{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding-top:20px; }
  .actions button{ font:12px 'IBM Plex Mono',monospace; text-transform:uppercase; cursor:pointer; padding:12px 18px; background:none; color:var(--ink-dim); border:1px solid var(--line); }
  #publishBtn{ color:var(--gold-bright); border-color:var(--gold); }
  #saveBtn{ color:var(--teal-bright); border-color:var(--teal); }
  #statusMsg{ font:12px 'IBM Plex Mono',monospace; color:var(--ink-dim); }
  @media(max-width:700px){ .form-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<nav class="site-nav admin-nav"><div class="wrap">
  <a class="brand" href="/admin/products.html"><img src="/assets/logo.png" alt="Central Asia Trade Research">Admin <em>Product</em></a>
  <a class="text-link" href="/admin/products.html">← Back to products</a>
</div></nav>
<main class="wrap">
  <header class="hero" style="padding:48px 0 30px;">
    <div class="eyebrow"><span class="dot"></span><span id="modeLabel">NEW PRODUCT</span></div>
    <h1 id="pageTitle" style="font-size:clamp(28px,4vw,40px);">Create a product</h1>
  </header>
  <section style="border-bottom:none;padding-top:32px;">
    <div class="form-grid">
      <div class="field"><label for="nameInput">Product name</label><input id="nameInput" type="text" placeholder="Raisins"></div>
      <div class="field"><label for="countryInput">Exporting country</label><input id="countryInput" type="text" value="Uzbekistan"></div>
      <div class="field"><label for="hsInput">HS code</label><input id="hsInput" type="text" inputmode="numeric" placeholder="080620"></div>
      <div class="field"><label for="hsDescriptionInput">Official HS description</label><input id="hsDescriptionInput" type="text" placeholder="Dried grapes"></div>
    </div>
    <div class="field"><label for="overviewInput">Short overview</label><textarea id="overviewInput" rows="5" placeholder="Why this product matters to the region's trade economy."></textarea></div>
    <div class="actions">
      <button id="saveBtn">Save Draft</button>
      <button id="publishBtn">Save &amp; Publish</button>
      <span id="statusMsg"></span>
    </div>
  </section>
</main>
<script>
  const slug = new URLSearchParams(window.location.search).get('slug');
  const fields = {
    name:document.getElementById('nameInput'), country:document.getElementById('countryInput'),
    hsCode:document.getElementById('hsInput'), hsDescription:document.getElementById('hsDescriptionInput'),
    overview:document.getElementById('overviewInput')
  };
  const statusMsg = document.getElementById('statusMsg');

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.authenticated) { window.location.href='/admin/'; return false; }
    return true;
  }

  async function loadProduct() {
    if (!slug) return;
    document.getElementById('modeLabel').textContent='EDIT PRODUCT';
    document.getElementById('pageTitle').textContent='Edit product';
    const res = await fetch(`/api/admin/products/${encodeURIComponent(slug)}`);
    const data = await res.json();
    if (!res.ok) { statusMsg.textContent=data.error || 'Could not load product.'; return; }
    Object.entries(fields).forEach(([key,input]) => { input.value=data.product[key] || ''; });
  }

  function payload(status) {
    return {
      name:fields.name.value.trim(), country:fields.country.value.trim(), hsCode:fields.hsCode.value.trim(),
      hsDescription:fields.hsDescription.value.trim(), overview:fields.overview.value.trim(), status
    };
  }

  async function save(status) {
    statusMsg.textContent='Saving…';
    const res = await fetch(slug ? `/api/admin/products/${encodeURIComponent(slug)}` : '/api/admin/products', {
      method:slug ? 'PUT' : 'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload(status))
    });
    const data = await res.json();
    if (!res.ok) { statusMsg.textContent='Error: ' + (data.error || 'Save failed'); return; }
    if (!slug) { window.location.href=`/admin/product-editor.html?slug=${encodeURIComponent(data.product.slug)}`; return; }
    statusMsg.textContent='Saved ✓';
  }

  document.getElementById('saveBtn').addEventListener('click',() => save('draft'));
  document.getElementById('publishBtn').addEventListener('click',() => save('published'));
  (async () => { if (await checkAuth()) loadProduct(); })();
</script>
</body>
</html>
