<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>Dataset Editor — Central Asia Trade Research</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="stylesheet" href="/assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .admin-nav .wrap{padding:18px 28px}.field{margin-bottom:18px}.field label{display:block;font:11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px}.field input,.field textarea,.field select{width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--ink);font:15px 'Source Serif 4',serif;padding:11px 12px}.field textarea{resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.help{font:12px 'IBM Plex Mono',monospace;color:var(--ink-dim);margin-top:7px}.csv-panel{background:var(--bg-raised);border:1px solid var(--line);padding:20px;margin:8px 0 22px}.csv-preview{overflow:auto;max-height:260px;margin-top:16px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:20px}.actions button{font:12px 'IBM Plex Mono',monospace;text-transform:uppercase;cursor:pointer;padding:12px 18px;background:none;color:var(--ink-dim);border:1px solid var(--line)}#publishBtn{color:var(--gold-bright);border-color:var(--gold)}#saveBtn{color:var(--teal-bright);border-color:var(--teal)}#statusMsg,#csvStatus{font:12px 'IBM Plex Mono',monospace;color:var(--ink-dim)}@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="site-nav admin-nav"><div class="wrap"><a class="brand" href="/admin/datasets.html"><img src="/assets/logo.png" alt="Central Asia Trade Research">Admin <em>Dataset</em></a><a class="text-link" href="/admin/datasets.html">← Back to datasets</a></div></nav>
<main class="wrap">
  <header class="hero" style="padding:48px 0 30px;"><div class="eyebrow"><span class="dot"></span><span id="modeLabel">NEW DATASET</span></div><h1 id="pageTitle" style="font-size:clamp(28px,4vw,40px);">Upload a dataset</h1></header>
  <section style="border-bottom:none;padding-top:32px;">
    <div class="form-grid"><div class="field"><label for="titleInput">Dataset title</label><input id="titleInput" type="text" placeholder="Uzbekistan Raisin Exports, 2019–2025"></div><div class="field"><label for="productInput">Product</label><select id="productInput"><option value="">Loading products…</option></select></div></div>
    <div class="form-grid"><div class="field"><label for="typeInput">Dataset type</label><select id="typeInput"><option value="annual_trade">Annual trade</option><option value="destinations">Destinations</option><option value="production">Regional production</option><option value="routes">Trade routes</option><option value="other">Other</option></select></div><div class="field"><label for="dateCheckedInput">Date checked</label><input id="dateCheckedInput" type="date"></div></div>
    <div class="field"><label for="descriptionInput">Description</label><textarea id="descriptionInput" rows="3" placeholder="What this dataset contains and why it is useful."></textarea></div>
    <div class="form-grid"><div class="field"><label for="sourceNameInput">Primary source</label><input id="sourceNameInput" type="text" placeholder="UN Comtrade"></div><div class="field"><label for="sourceUrlInput">Direct source URL</label><input id="sourceUrlInput" type="url" placeholder="https://..."></div></div>
    <div class="csv-panel">
      <div class="field" style="margin-bottom:0;"><label for="csvInput">CSV file</label><input id="csvInput" type="file" accept=".csv,text/csv"><p class="help" id="columnHelp"></p><p id="csvStatus"></p></div>
      <div class="csv-preview" id="csvPreview"></div>
    </div>
    <div class="actions"><button id="saveBtn">Save Draft</button><button id="publishBtn">Save &amp; Publish</button><span id="statusMsg"></span></div>
  </section>
</main>
<script>
  const slug=new URLSearchParams(window.location.search).get('slug'); let csvText=''; let existingDataset=null;
  const titleInput=document.getElementById('titleInput'),productInput=document.getElementById('productInput'),typeInput=document.getElementById('typeInput'),descriptionInput=document.getElementById('descriptionInput'),sourceNameInput=document.getElementById('sourceNameInput'),sourceUrlInput=document.getElementById('sourceUrlInput'),dateCheckedInput=document.getElementById('dateCheckedInput'),csvInput=document.getElementById('csvInput'),csvStatus=document.getElementById('csvStatus'),csvPreview=document.getElementById('csvPreview'),statusMsg=document.getElementById('statusMsg'),columnHelp=document.getElementById('columnHelp');
  const help={annual_trade:'Required columns: year, export_value_usd, export_volume_kg',destinations:'Required: year, destination_country, value_usd. Optional: volume_kg',production:'Required: year, region, production_tonnes',routes:'Required: destination, origin, border_crossing, transport_mode, transit_days',other:'Use a header row and at least two columns.'};
  function escapeHtml(value){const div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML;}
  function updateHelp(){columnHelp.textContent=help[typeInput.value];}
  function previewRows(columns,rows){csvPreview.innerHTML=`<table><thead><tr>${columns.map((c)=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,8).map((row)=>`<tr>${columns.map((c)=>`<td>${escapeHtml(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
  function quickParse(source){
    const lines=source.replace(/^\uFEFF/,'').split(/\r?\n/).filter((line)=>line.trim()); if(lines.length<2)return null;
    const columns=lines[0].split(',').map((item)=>item.trim().replace(/^"|"$/g,''));
    const rows=lines.slice(1,9).map((line)=>{const values=line.split(',');const row={};columns.forEach((column,index)=>{row[column]=values[index]||'';});return row;}); return {columns,rows};
  }
  async function checkAuth(){const res=await fetch('/api/auth/me');const data=await res.json();if(!data.authenticated){window.location.href='/admin/';return false;}return true;}
  async function loadProducts(){const res=await fetch('/api/admin/products');const data=await res.json();const products=data.products||[];productInput.innerHTML='<option value="">Select a product</option>'+products.map((product)=>`<option value="${escapeHtml(product.slug)}">${escapeHtml(product.name)} · ${escapeHtml(product.country)} · HS ${escapeHtml(product.hsCode)}</option>`).join('');}
  async function loadDataset(){
    if(!slug){dateCheckedInput.value=new Date().toISOString().slice(0,10);return;}
    document.getElementById('modeLabel').textContent='EDIT DATASET';document.getElementById('pageTitle').textContent='Edit dataset';
    const res=await fetch(`/api/admin/datasets/${encodeURIComponent(slug)}`);const data=await res.json();if(!res.ok){statusMsg.textContent=data.error||'Could not load dataset.';return;}
    existingDataset=data.dataset;titleInput.value=existingDataset.title||'';productInput.value=existingDataset.productSlug||'';typeInput.value=existingDataset.dataType||'other';descriptionInput.value=existingDataset.description||'';sourceNameInput.value=existingDataset.sourceName||'';sourceUrlInput.value=existingDataset.sourceUrl||'';dateCheckedInput.value=existingDataset.dateChecked||'';csvStatus.textContent=`Current dataset: ${existingDataset.rowCount||0} rows. Choose a new CSV only to replace the data.`;previewRows(existingDataset.columns||[],existingDataset.rows||[]);updateHelp();
  }
  csvInput.addEventListener('change',async()=>{const file=csvInput.files[0];if(!file)return;csvText=await file.text();csvStatus.textContent=`Selected ${file.name} · ${Math.max(0,csvText.split(/\r?\n/).filter(Boolean).length-1)} data rows`;const parsed=quickParse(csvText);if(parsed)previewRows(parsed.columns,parsed.rows);});
  typeInput.addEventListener('change',updateHelp);updateHelp();
  function payload(status){return{title:titleInput.value.trim(),productSlug:productInput.value,dataType:typeInput.value,description:descriptionInput.value.trim(),sourceName:sourceNameInput.value.trim(),sourceUrl:sourceUrlInput.value.trim(),dateChecked:dateCheckedInput.value,status,...(csvText?{csvText}:{})};}
  async function save(status){
    if(!slug&&!csvText){statusMsg.textContent='Choose a CSV file first.';return;}statusMsg.textContent='Validating and saving…';
    const res=await fetch(slug?`/api/admin/datasets/${encodeURIComponent(slug)}`:'/api/admin/datasets',{method:slug?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(status))});const data=await res.json();
    if(!res.ok){statusMsg.textContent='Error: '+(data.error||'Save failed');return;}if(!slug){window.location.href=`/admin/dataset-editor.html?slug=${encodeURIComponent(data.dataset.slug)}`;return;}existingDataset=data.dataset;csvText='';csvInput.value='';statusMsg.textContent='Saved ✓';csvStatus.textContent=`Current dataset: ${existingDataset.rowCount} rows.`;previewRows(existingDataset.columns,existingDataset.rows);
  }
  document.getElementById('saveBtn').addEventListener('click',()=>save('draft'));document.getElementById('publishBtn').addEventListener('click',()=>save('published'));
  (async()=>{if(await checkAuth()){await loadProducts();await loadDataset();}})();
</script>
</body>
</html>
