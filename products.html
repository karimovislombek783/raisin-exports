<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Products — Central Asia Trade Research Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .admin-nav .wrap{ padding:18px 28px; }
  .admin-actions,.row-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row-actions button{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; background:none; border:1px solid var(--line); color:var(--ink-dim); padding:6px 10px; cursor:pointer; }
  .row-actions button:hover{ color:var(--ink); border-color:var(--gold); }
  .row-actions .danger:hover{ color:#E36E6E; border-color:var(--wine); }
  .table-wrap{ overflow-x:auto; }
  #loadingMsg,#emptyMsg,#errorMsg{ font-family:'IBM Plex Mono',monospace; color:var(--ink-dim); font-size:13px; }
</style>
</head>
<body>
<nav class="site-nav admin-nav">
  <div class="wrap">
    <a class="brand" href="/admin/dashboard.html"><img src="/assets/logo.png" alt="Central Asia Trade Research">Admin <em>Products</em></a>
    <div class="admin-actions">
      <a class="text-link" href="/admin/dashboard.html">Articles</a>
      <a class="text-link" href="/admin/datasets.html">Datasets</a>
      <a class="btn" href="/admin/product-editor.html">+ New Product</a>
    </div>
  </div>
</nav>
<main class="wrap">
  <header class="hero" style="padding:48px 0 36px;">
    <div class="eyebrow"><span class="dot"></span>RESEARCH CATALOG</div>
    <h1 style="font-size:clamp(28px,4vw,40px);">Products</h1>
    <p class="dek" style="margin-bottom:0;">Create a product once, then connect its datasets and articles.</p>
  </header>
  <section style="border-bottom:none;">
    <p id="loadingMsg">Loading products…</p>
    <p id="emptyMsg" style="display:none;">No products yet. Create the product before uploading its first dataset.</p>
    <p id="errorMsg" style="display:none;"></p>
    <div class="table-wrap">
      <table id="productTable" style="display:none;">
        <thead><tr><th>Product</th><th>Country</th><th>HS code</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="productTbody"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const table = document.getElementById('productTable');
  const tbody = document.getElementById('productTbody');
  const loadingMsg = document.getElementById('loadingMsg');
  const emptyMsg = document.getElementById('emptyMsg');
  const errorMsg = document.getElementById('errorMsg');

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value || '';
    return div.innerHTML;
  }

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.authenticated) {
      window.location.href = '/admin/';
      return false;
    }
    return true;
  }

  async function loadProducts() {
    errorMsg.style.display = 'none';
    const res = await fetch('/api/admin/products');
    if (res.status === 401) {
      window.location.href = '/admin/';
      return;
    }
    const data = await res.json();
    loadingMsg.style.display = 'none';
    const products = data.products || [];
    if (!products.length) {
      emptyMsg.style.display = 'block';
      table.style.display = 'none';
      return;
    }
    emptyMsg.style.display = 'none';
    table.style.display = 'table';
    tbody.innerHTML = products.map((product) => `
      <tr>
        <td><a href="/admin/product-editor.html?slug=${encodeURIComponent(product.slug)}" style="color:var(--ink);text-decoration:none;">${escapeHtml(product.name)}</a></td>
        <td>${escapeHtml(product.country)}</td>
        <td>${escapeHtml(product.hsCode)}</td>
        <td><span class="status-pill ${product.status === 'published' ? 'live' : ''}">${product.status === 'published' ? 'Published' : 'Draft'}</span></td>
        <td><div class="row-actions">
          <button data-action="edit" data-slug="${product.slug}">Edit</button>
          <button data-action="toggle" data-slug="${product.slug}" data-status="${product.status}">${product.status === 'published' ? 'Unpublish' : 'Publish'}</button>
          ${product.status === 'published' ? `<a href="/products/${encodeURIComponent(product.slug)}" target="_blank" rel="noopener"><button type="button">View</button></a>` : ''}
          <button class="danger" data-action="delete" data-slug="${product.slug}">Delete</button>
        </div></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('button[data-action]').forEach((button) => button.addEventListener('click', handleAction));
  }

  async function handleAction(event) {
    const button = event.currentTarget;
    const slug = button.dataset.slug;
    if (button.dataset.action === 'edit') {
      window.location.href = `/admin/product-editor.html?slug=${encodeURIComponent(slug)}`;
      return;
    }
    if (button.dataset.action === 'toggle') {
      button.disabled = true;
      const status = button.dataset.status === 'published' ? 'draft' : 'published';
      const res = await fetch(`/api/admin/products/${encodeURIComponent(slug)}`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ status })
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || 'Could not update product.';
        errorMsg.style.display = 'block';
        button.disabled = false;
        return;
      }
      loadProducts();
      return;
    }
    if (button.dataset.action === 'delete') {
      if (!confirm('Delete this product? Products with linked datasets or articles cannot be deleted.')) return;
      button.disabled = true;
      const res = await fetch(`/api/admin/products/${encodeURIComponent(slug)}`, { method:'DELETE' });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || 'Could not delete product.';
        errorMsg.style.display = 'block';
        button.disabled = false;
        return;
      }
      loadProducts();
    }
  }

  (async () => { if (await checkAuth()) loadProducts(); })();
</script>
</body>
</html>
