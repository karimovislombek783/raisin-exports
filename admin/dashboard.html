<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Dashboard — Central Asia Trade Research</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .admin-nav .wrap{ padding: 18px 28px; }
  .admin-actions{ display:flex; align-items:center; gap:14px; }
  .admin-actions button, .admin-actions a{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing:0.05em; text-transform:uppercase;
  }
  .logout-btn{
    background:none; border:1px solid var(--line); color: var(--ink-dim);
    padding: 8px 14px; cursor:pointer;
  }
  .logout-btn:hover{ border-color: var(--wine); color: var(--ink); }
  .row-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .row-actions button{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing:0.04em; text-transform:uppercase;
    background:none; border: 1px solid var(--line); color: var(--ink-dim);
    padding: 6px 10px; cursor:pointer;
  }
  .row-actions button:hover{ color: var(--ink); border-color: var(--gold); }
  .row-actions button.danger:hover{ border-color: var(--wine); color: #E36E6E; }
  #loadingMsg, #emptyMsg{
    font-family:'IBM Plex Mono', monospace; color: var(--ink-dim); font-size: 13px;
  }
  .article-table-wrap{ overflow-x:auto; }
</style>
</head>
<body>

<nav class="site-nav admin-nav">
  <div class="wrap">
    <a class="brand" href="/admin/dashboard.html"><img src="/assets/logo.png" alt="Central Asia Trade Research">Admin <em>Dashboard</em></a>
    <div class="admin-actions">
      <a class="text-link" href="/admin/products.html">Products</a>
      <a class="text-link" href="/admin/datasets.html">Datasets</a>
      <a class="btn" href="/admin/editor.html">+ New Article</a>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="hero" style="padding: 48px 0 36px;">
    <div class="eyebrow"><span class="dot"></span>SIGNED IN AS <span id="whoami">…</span></div>
    <h1 style="font-size: clamp(28px, 4vw, 40px);">Your articles</h1>
    <p class="dek" style="margin-bottom:0;">Drafts, upcoming, and published dossiers. Publishing an article makes it appear automatically on the public Research page.</p>
  </header>

  <section style="border-bottom:none;">
    <p id="loadingMsg">Loading articles…</p>
    <p id="emptyMsg" style="display:none;">No articles yet. <a class="text-link" href="/admin/editor.html">Create your first one →</a></p>

    <div class="article-table-wrap">
      <table id="articleTable" style="display:none;">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Date</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="articleTbody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
  const whoamiEl = document.getElementById('whoami');
  const loadingMsg = document.getElementById('loadingMsg');
  const emptyMsg = document.getElementById('emptyMsg');
  const table = document.getElementById('articleTable');
  const tbody = document.getElementById('articleTbody');

  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    } catch { return iso; }
  }

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.authenticated) {
      window.location.href = '/admin/';
      return null;
    }
    whoamiEl.textContent = data.username;
    return data;
  }

  async function loadArticles() {
    const res = await fetch('/api/admin/articles');
    if (res.status === 401) {
      window.location.href = '/admin/';
      return;
    }
    const data = await res.json();
    const articles = data.articles || [];

    loadingMsg.style.display = 'none';

    if (articles.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    tbody.innerHTML = '';

    articles.forEach((a) => {
      const tr = document.createElement('tr');

      const isPublished = a.status === 'published';
      const isUpcoming = a.status === 'upcoming';
      const statusLabel = isPublished ? 'Published' : isUpcoming ? 'Upcoming' : 'Draft';
      const statusClass = isPublished ? 'live' : '';

      tr.innerHTML = `
        <td style="text-align:left;">
          <a href="/admin/editor.html?slug=${encodeURIComponent(a.slug)}" style="color:var(--ink); text-decoration:none; font-family:'Fraunces',serif; font-size:15px;">${escapeHtml(a.title)}</a>
        </td>
        <td>
          <span class="status-pill ${statusClass}">${statusLabel}</span>
        </td>
        <td>${fmtDate(a.date)}</td>
        <td>${fmtDate(a.updatedAt)}</td>
        <td>
          <div class="row-actions">
            <button data-action="edit" data-slug="${a.slug}">Edit</button>
            <button data-action="toggle" data-slug="${a.slug}" data-status="${a.status}">${isPublished ? 'Unpublish' : 'Publish'}</button>
            ${isPublished ? `<a href="/research/${encodeURIComponent(a.slug)}" target="_blank" rel="noopener" style="align-self:center;"><button type="button">View</button></a>` : ''}
            <button data-action="delete" data-slug="${a.slug}" class="danger">Delete</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('button[data-action]').forEach((btn) => {
      btn.addEventListener('click', handleRowAction);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function handleRowAction(e) {
    const btn = e.currentTarget;
    const action = btn.dataset.action;
    const slug = btn.dataset.slug;

    if (action === 'edit') {
      window.location.href = `/admin/editor.html?slug=${encodeURIComponent(slug)}`;
      return;
    }

    if (action === 'toggle') {
      const newStatus = btn.dataset.status === 'published' ? 'draft' : 'published';
      btn.disabled = true;
      const res = await fetch(`/api/admin/articles/${encodeURIComponent(slug)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Could not update article status.');
        btn.disabled = false;
        return;
      }
      loadArticles();
      return;
    }

    if (action === 'delete') {
      if (!confirm('Delete this article permanently? This cannot be undone.')) return;
      btn.disabled = true;
      const res = await fetch(`/api/admin/articles/${encodeURIComponent(slug)}`, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Could not delete article.');
        btn.disabled = false;
        return;
      }
      loadArticles();
      return;
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/admin/';
  });

  (async () => {
    const auth = await checkAuth();
    if (auth) loadArticles();
  })();
</script>

</body>
</html>
