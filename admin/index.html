<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Uzbekistan Research Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .login-wrap{
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;
    padding: 24px;
  }
  .login-card{
    width: 100%; max-width: 380px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 36px 32px;
  }
  .login-card h1{
    font-size: 26px; margin-bottom: 8px; max-width: none;
  }
  .login-card .dek{ font-size: 14.5px; margin-bottom: 28px; max-width:none; }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-dim); margin-bottom: 8px;
  }
  .field input{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family:'Source Serif 4', serif;
    font-size: 15px;
    padding: 11px 12px;
  }
  .field input:focus{ outline:none; border-color: var(--gold); }
  .login-error{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #E36E6E;
    min-height: 16px;
    margin-bottom: 14px;
  }
  .login-submit{
    width:100%; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px; letter-spacing:0.06em; text-transform:uppercase;
    background: var(--gold); border: 1px solid var(--gold); color: #1B1416;
    font-weight:600; padding: 12px 20px;
  }
  .login-submit:hover{ background: var(--gold-bright); }
  .login-submit:disabled{ opacity:0.6; cursor:default; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="eyebrow" style="margin-bottom:16px;"><span class="dot"></span>ADMIN</div>
    <h1>Sign in</h1>
    <p class="dek">Uzbekistan Research Desk — admin dashboard.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="error"></p>
      <button type="submit" class="login-submit" id="submitBtn">Sign in</button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        errorEl.textContent = data.error || 'Login failed.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        return;
      }

      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>

</body>
</html>
