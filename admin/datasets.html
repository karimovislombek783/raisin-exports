<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Datasets — Central Asia Trade Research Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .admin-nav .wrap{ padding:18px 28px; }
  .admin-actions,.row-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row-actions button{ font:11px 'IBM Plex Mono',monospace; text-transform:uppercase; background:none; border:1px solid var(--line); color:var(--ink-dim); padding:6px 10px; cursor:pointer; }
  .row-actions button:hover{ color:var(--ink); border-color:var(--gold); }
  .row-actions .danger:hover{ color:#E36E6E; border-color:var(--wine); }
  .table-wrap{ overflow-x:auto; }
  #loadingMsg,#emptyMsg,#errorMsg{ font:13px 'IBM Plex Mono',monospace; color:var(--ink-dim); }
</style>
</head>
<body>
<nav class="site-nav admin-nav"><div class="wrap">
  <a class="brand" href="/admin/dashboard.html"><img src="/assets/logo.png" alt="Central Asia Trade Research">Admin <em>Datasets</em></a>
  <div class="admin-actions"><a class="text-link" href="/admin/dashboard.html">Articles</a><a class="text-link" href="/admin/products.html">Products</a><a class="btn" href="/admin/dataset-editor.html">+ New Dataset</a></div>
</div></nav>
<main class="wrap">
  <header class="hero" style="padding:48px 0 36px;"><div class="eyebrow"><span class="dot"></span>DATA MANAGEMENT</div><h1 style="font-size:clamp(28px,4vw,40px);">Datasets</h1><p class="dek" style="margin-bottom:0;">Upload a verified CSV, connect it to a product, and publish it to the Data Explorer.</p></header>
  <section style="border-bottom:none;">
    <p id="loadingMsg">Loading datasets…</p><p id="emptyMsg" style="display:none;">No datasets yet. Create and publish a product first.</p><p id="errorMsg" style="display:none;"></p>
    <div class="table-wrap"><table id="datasetTable" style="display:none;"><thead><tr><th>Dataset</th><th>Product</th><th>Rows</th><th>Years</th><th>Status</th><th>Actions</th></tr></thead><tbody id="datasetTbody"></tbody></table></div>
  </section>
</main>
<script>
  const table=document.getElementById('datasetTable');
  const tbody=document.getElementById('datasetTbody');
  const loadingMsg=document.getElementById('loadingMsg');
  const emptyMsg=document.getElementById('emptyMsg');
  const errorMsg=document.getElementById('errorMsg');
  function escapeHtml(value){const div=document.createElement('div');div.textContent=value||'';return div.innerHTML;}
  function years(item){const y=item.coveredYears||{};return y.start ? (y.start===y.end ? String(y.start) : `${y.start}–${y.end}`) : '—';}
  async function checkAuth(){const res=await fetch('/api/auth/me');const data=await res.json();if(!data.authenticated){window.location.href='/admin/';return false;}return true;}
  async function loadDatasets(){
    errorMsg.style.display='none';
    const res=await fetch('/api/admin/datasets');
    if(res.status===401){window.location.href='/admin/';return;}
    const data=await res.json(); loadingMsg.style.display='none'; const datasets=data.datasets||[];
    if(!datasets.length){emptyMsg.style.display='block';table.style.display='none';return;}
    emptyMsg.style.display='none';table.style.display='table';
    tbody.innerHTML=datasets.map((dataset)=>`<tr>
      <td><a href="/admin/dataset-editor.html?slug=${encodeURIComponent(dataset.slug)}" style="color:var(--ink);text-decoration:none;">${escapeHtml(dataset.title)}</a></td>
      <td>${escapeHtml(dataset.productName)}</td><td>${dataset.rowCount||0}</td><td>${years(dataset)}</td>
      <td><span class="status-pill ${dataset.status==='published'?'live':''}">${dataset.status==='published'?'Published':'Draft'}</span></td>
      <td><div class="row-actions"><button data-action="edit" data-slug="${dataset.slug}">Edit</button><button data-action="toggle" data-slug="${dataset.slug}" data-status="${dataset.status}">${dataset.status==='published'?'Unpublish':'Publish'}</button>${dataset.status==='published'?`<a href="/data/${encodeURIComponent(dataset.slug)}" target="_blank" rel="noopener"><button type="button">View</button></a>`:''}<button class="danger" data-action="delete" data-slug="${dataset.slug}">Delete</button></div></td>
    </tr>`).join('');
    tbody.querySelectorAll('button[data-action]').forEach((button)=>button.addEventListener('click',handleAction));
  }
  async function handleAction(event){
    const button=event.currentTarget; const slug=button.dataset.slug; const action=button.dataset.action;
    if(action==='edit'){window.location.href=`/admin/dataset-editor.html?slug=${encodeURIComponent(slug)}`;return;}
    if(action==='toggle'){
      button.disabled=true; const status=button.dataset.status==='published'?'draft':'published';
      const res=await fetch(`/api/admin/datasets/${encodeURIComponent(slug)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); const data=await res.json();
      if(!res.ok){errorMsg.textContent=data.error||'Could not update dataset.';errorMsg.style.display='block';button.disabled=false;return;} loadDatasets();return;
    }
    if(action==='delete'){
      if(!confirm('Delete this dataset? Linked datasets cannot be deleted.'))return; button.disabled=true;
      const res=await fetch(`/api/admin/datasets/${encodeURIComponent(slug)}`,{method:'DELETE'}); const data=await res.json();
      if(!res.ok){errorMsg.textContent=data.error||'Could not delete dataset.';errorMsg.style.display='block';button.disabled=false;return;} loadDatasets();
    }
  }
  (async()=>{if(await checkAuth())loadDatasets();})();
</script>
</body>
</html>
